<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const videoElement = document.getElementById('video');
const blackout = document.getElementById('blackout');
const restscreen = document.getElementById('restscreen');
const statusEl = document.getElementById('status');

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function eyeAspectRatio(landmarks, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => landmarks[i]);
  const vertical = dist(p2, p6) + dist(p3, p5);
  const horizontal = dist(p1, p4) * 2;
  return vertical / horizontal;
}

const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const EAR_THRESHOLD = 0.22;

function showBlackout() {
  blackout.style.display = 'block';
  restscreen.style.display = 'none';
}
function showRestScreen() {
  blackout.style.display = 'none';
  restscreen.style.display = 'flex';
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    const leftEAR = eyeAspectRatio(landmarks, LEFT_EYE);
    const rightEAR = eyeAspectRatio(landmarks, RIGHT_EYE);
    const avgEAR = (leftEAR + rightEAR) / 2;

    if (avgEAR > EAR_THRESHOLD) {
      showBlackout();
      statusEl.textContent = `Eyes OPEN (EAR ${avgEAR.toFixed(2)}) -> blackout`;
    } else {
      showRestScreen();
      statusEl.textContent = `Eyes CLOSED (EAR ${avgEAR.toFixed(2)}) -> resting`;
    }
  } else {
    showRestScreen();
    statusEl.textContent = 'No face detected -> resting';
  }
});

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 320,
  height: 240,
  facingMode: 'user'
});

camera.start()
  .then(() => { statusEl.textContent = 'Running...'; })
  .catch(err => { statusEl.textContent = 'Camera error: ' + err.message; });
</script>
