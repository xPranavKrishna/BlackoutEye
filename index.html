<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eye Blackout - Useless App</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #111; height: 100%; width: 100%;
  }
  #blackout, #restscreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: none; z-index: 10;
  }
  #blackout {
    background: #000;
  }
  #restscreen {
    background: #ffffff;
    align-items: center;
    justify-content: center;
  }
  .clown-doodle {
    position: absolute;
    width: 70px;
    height: 70px;
    z-index: 0;
    opacity: 0.9;
  }
  .content {
    position: relative;
    z-index: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    display: flex;
  }
  .content svg#face {
    width: 170px; height: 170px;
    margin-bottom: 12px;
  }
  .content p {
    font-size: 20px; font-weight: 600; margin: 0; padding: 0 20px;
    font-family: -apple-system, sans-serif;
    color: #222;
  }
  #status {
    position: fixed; bottom: 12px; left: 12px; color: #0f0;
    font-family: monospace; font-size: 12px; z-index: 20;
    background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px;
    max-width: 80vw;
  }
  video { display: none; }
</style>
</head>
<body>

<video id="video" playsinline></video>

<div id="blackout"></div>

<!-- reusable clown face shape -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="clownFace">
      <circle cx="15" cy="42" r="15" fill="#ff7043"/>
      <circle cx="105" cy="42" r="15" fill="#ff7043"/>
      <circle cx="60" cy="10" r="15" fill="#ff7043"/>
      <circle cx="60" cy="60" r="42" fill="#fff5e1" stroke="#222" stroke-width="3"/>
      <circle cx="42" cy="55" r="5" fill="#222"/>
      <circle cx="78" cy="55" r="5" fill="#222"/>
      <circle cx="60" cy="70" r="10" fill="#e53935"/>
      <path d="M35 85 Q60 110 85 85" fill="none" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<div id="restscreen">

  <!-- scattered clown faces around the screen -->
  <svg class="clown-doodle" style="top:6%; left:8%; transform:rotate(-8deg);" viewBox="0 0 120 120"><use href="#clownFace"/></svg>
  <svg class="clown-doodle" style="top:10%; right:6%; transform:rotate(12deg) scale(0.8);" viewBox="0 0 120 120"><use href="#clownFace"/></svg>
  <svg class="clown-doodle" style="bottom:8%; left:12%; transform:rotate(5deg) scale(1.1);" viewBox="0 0 120 120"><use href="#clownFace"/></svg>
  <svg class="clown-doodle" style="bottom:6%; right:10%; transform:rotate(-15deg) scale(0.9);" viewBox="0 0 120 120"><use href="#clownFace"/></svg>
  <svg class="clown-doodle" style="top:42%; left:3%; transform:rotate(3deg) scale(0.7);" viewBox="0 0 120 120"><use href="#clownFace"/></svg>

  <div class="content">
    <!-- laughing face -->
    <svg id="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#222" stroke-width="4"/>
      <path d="M55 85 Q70 68 85 85" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <path d="M115 85 Q130 68 145 85" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="100" cy="138" rx="38" ry="26" fill="#222"/>
      <ellipse cx="100" cy="150" rx="18" ry="10" fill="#e57373"/>
    </svg>
    <p>Ahh, nee oru VAAZHA 🤡</p>
  </div>

</div>

<div id="status">Loading model...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const videoElement = document.getElementById('video');
const blackout = document.getElementById('blackout');
const restscreen = document.getElementById('restscreen');
const statusEl = document.getElementById('status');

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function eyeAspectRatio(landmarks, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => landmarks[i]);
  const vertical = dist(p2, p6) + dist(p3, p5);
  const horizontal = dist(p1, p4) * 2;
  return vertical / horizontal;
}

const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const EAR_THRESHOLD = 0.22;

function showBlackout() {
  blackout.style.display = 'block';
  restscreen.style.display = 'none';
}
function showRestScreen() {
  blackout.style.display = 'none';
  restscreen.style.display = 'flex';
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    const leftEAR = eyeAspectRatio(landmarks, LEFT_EYE);
    const rightEAR = eyeAspectRatio(landmarks, RIGHT_EYE);
    const avgEAR = (leftEAR + rightEAR) / 2;

    if (avgEAR > EAR_THRESHOLD) {
      showBlackout();
      statusEl.textContent = `Eyes OPEN (EAR ${avgEAR.toFixed(2)}) -> blackout`;
    } else {
      showRestScreen();
      statusEl.textContent = `Eyes CLOSED (EAR ${avgEAR.toFixed(2)}) -> resting`;
    }
  } else {
    showRestScreen();
    statusEl.textContent = 'No face detected -> resting';
  }
});

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 320,
  height: 240,
  facingMode: 'user'
});

camera.start()
  .then(() => { statusEl.textContent = 'Running...'; })
  .catch(err => { statusEl.textContent = 'Camera error: ' + err.message; });
</script>

</body>
</html>
