<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eye Blackout - Useless App</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #111; height: 100%; width: 100%;
  }
  #blackout, #restscreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: none; z-index: 10;
  }
  #blackout {
    background: #000;
  }
  #restscreen {
    background: #fffdf7;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* confetti background */
  .confetti {
    position: absolute;
    border-radius: 3px;
    opacity: 0.85;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-120vh) rotate(360deg); }
  }

  /* card */
  .card {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
    border: 4px solid #222;
    border-radius: 28px;
    padding: 28px 30px 24px;
    box-shadow: 8px 8px 0px #222;
    transform: rotate(-2deg);
  }

  #face {
    width: 150px;
    height: 150px;
    animation: bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }

  .bubble {
    margin-top: 6px;
    background: #ffd54f;
    border: 3px solid #222;
    border-radius: 16px;
    padding: 10px 18px;
    font-family: -apple-system, sans-serif;
    font-weight: 800;
    font-size: 19px;
    color: #222;
    transform: rotate(2deg);
    position: relative;
  }
  .bubble::after {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    margin-left: -8px;
    border-width: 0 8px 12px 8px;
    border-style: solid;
    border-color: transparent transparent #222 transparent;
  }
  .bubble::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    margin-left: -6px;
    border-width: 0 6px 9px 6px;
    border-style: solid;
    border-color: transparent transparent #ffd54f transparent;
    z-index: 1;
  }

  .clown-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .clown-row svg {
    width: 34px;
    height: 34px;
  }
  .clown-row svg:nth-child(odd) {
    transform: rotate(-8deg);
  }
  .clown-row svg:nth-child(even) {
    transform: rotate(8deg);
  }

  #status {
    position: fixed; bottom: 12px; left: 12px; color: #0f0;
    font-family: monospace; font-size: 12px; z-index: 20;
    background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px;
    max-width: 80vw;
  }
  video { display: none; }
</style>
</head>
<body>

<video id="video" playsinline></video>

<div id="blackout"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="clownFace">
      <circle cx="15" cy="42" r="15" fill="#ff7043"/>
      <circle cx="105" cy="42" r="15" fill="#ff7043"/>
      <circle cx="60" cy="10" r="15" fill="#ff7043"/>
      <circle cx="60" cy="60" r="42" fill="#fff5e1" stroke="#222" stroke-width="3"/>
      <circle cx="42" cy="55" r="5" fill="#222"/>
      <circle cx="78" cy="55" r="5" fill="#222"/>
      <circle cx="60" cy="70" r="10" fill="#e53935"/>
      <path d="M35 85 Q60 110 85 85" fill="none" stroke="#e53935" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<div id="restscreen">

  <!-- confetti, generated as simple styled divs -->
  <div class="confetti" style="left:8%;  width:10px; height:10px; background:#ff7043; animation-duration:4.2s; animation-delay:0s;   bottom:-10px;"></div>
  <div class="confetti" style="left:20%; width:8px;  height:8px;  background:#42a5f5; animation-duration:3.4s; animation-delay:0.6s; bottom:-10px;"></div>
  <div class="confetti" style="left:35%; width:12px; height:12px; background:#ffd54f; animation-duration:5s;   animation-delay:1.2s; bottom:-10px;"></div>
  <div class="confetti" style="left:50%; width:9px;  height:9px;  background:#66bb6a; animation-duration:3.9s; animation-delay:0.3s; bottom:-10px;"></div>
  <div class="confetti" style="left:65%; width:11px; height:11px; background:#ab47bc; animation-duration:4.6s; animation-delay:0.9s; bottom:-10px;"></div>
  <div class="confetti" style="left:78%; width:8px;  height:8px;  background:#ef5350; animation-duration:3.7s; animation-delay:1.5s; bottom:-10px;"></div>
  <div class="confetti" style="left:90%; width:10px; height:10px; background:#26c6da; animation-duration:4.9s; animation-delay:0.2s; bottom:-10px;"></div>
  <div class="confetti" style="left:14%; width:9px;  height:9px;  background:#ffa726; animation-duration:4.1s; animation-delay:1.8s; bottom:-10px;"></div>
  <div class="confetti" style="left:58%; width:10px; height:10px; background:#7e57c2; animation-duration:4.4s; animation-delay:0.7s; bottom:-10px;"></div>
  <div class="confetti" style="left:84%; width:8px;  height:8px;  background:#ec407a; animation-duration:3.6s; animation-delay:1.1s; bottom:-10px;"></div>

  <div class="card">
    <svg id="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="80" fill="#fff9e6" stroke="#222" stroke-width="4"/>
      <path d="M55 85 Q70 68 85 85" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <path d="M115 85 Q130 68 145 85" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="100" cy="138" rx="38" ry="26" fill="#222"/>
      <ellipse cx="100" cy="150" rx="18" ry="10" fill="#e57373"/>
      <circle cx="55" cy="105" r="10" fill="#ffb3ba" opacity="0.7"/>
      <circle cx="145" cy="105" r="10" fill="#ffb3ba" opacity="0.7"/>
    </svg>

    <div class="bubble">Ahh, nee oru VAAZHA 🤡</div>

    <div class="clown-row">
      <svg viewBox="0 0 120 120"><use href="#clownFace"/></svg>
      <svg viewBox="0 0 120 120"><use href="#clownFace"/></svg>
      <svg viewBox="0 0 120 120"><use href="#clownFace"/></svg>
    </div>
  </div>

</div>

<div id="status">Loading model...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const videoElement = document.getElementById('video');
const blackout = document.getElementById('blackout');
const restscreen = document.getElementById('restscreen');
const statusEl = document.getElementById('status');

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function eyeAspectRatio(landmarks, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => landmarks[i]);
  const vertical = dist(p2, p6) + dist(p3, p5);
  const horizontal = dist(p1, p4) * 2;
  return vertical / horizontal;
}

const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const EAR_THRESHOLD = 0.22;

function showBlackout() {
  blackout.style.display = 'block';
  restscreen.style.display = 'none';
}
function showRestScreen() {
  blackout.style.display = 'none';
  restscreen.style.display = 'flex';
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    const leftEAR = eyeAspectRatio(landmarks, LEFT_EYE);
    const rightEAR = eyeAspectRatio(landmarks, RIGHT_EYE);
    const avgEAR = (leftEAR + rightEAR) / 2;

    if (avgEAR > EAR_THRESHOLD) {
      showBlackout();
      statusEl.textContent = `Eyes OPEN (EAR ${avgEAR.toFixed(2)}) -> blackout`;
    } else {
      showRestScreen();
      statusEl.textContent = `Eyes CLOSED (EAR ${avgEAR.toFixed(2)}) -> resting`;
    }
  } else {
    showRestScreen();
    statusEl.textContent = 'No face detected -> resting';
  }
});

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 320,
  height: 240,
  facingMode: 'user'
});

camera.start()
  .then(() => { statusEl.textContent = 'Running...'; })
  .catch(err => { statusEl.textContent = 'Camera error: ' + err.message; });
</script>

</body>
</html>
