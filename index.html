<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Eye Blackout - Useless App</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #111; height: 100%; width: 100%;
  }
  #blackout, #restscreen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    display: none; z-index: 10;
  }
  #blackout {
    background: #000;
  }
  #restscreen {
    background: #ffffff;
    align-items: center;
    justify-content: center;
  }
  .banana-tree {
    position: absolute;
    width: 70px;
    height: 100px;
    z-index: 0;
    opacity: 0.9;
  }
  .content {
    position: relative;
    z-index: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: -apple-system, sans-serif;
    color: #222;
    display: flex;
  }
  .content svg#face {
    width: 140px; height: 140px; margin-bottom: 16px;
  }
  .content p {
    font-size: 20px; font-weight: 600; margin: 0; padding: 0 20px;
  }
  #status {
    position: fixed; bottom: 12px; left: 12px; color: #0f0;
    font-family: monospace; font-size: 12px; z-index: 20;
    background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px;
    max-width: 80vw;
  }
  video { display: none; }
</style>
</head>
<body>

<video id="video" playsinline></video>

<div id="blackout"></div>

<!-- reusable banana plant shape: thick stem + fanned blade leaves with midribs -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bananaPlant">
      <path d="M60 200 C55 170 58 140 70 120 C82 140 85 170 80 200 Z" fill="#9ccc65"/>
      <g transform="translate(70,120)">
        <g transform="rotate(-70)">
          <path d="M0 0 C-14 -20 -10 -55 0 -70 C10 -55 14 -20 0 0 Z" fill="#388e3c"/>
          <path d="M0 0 C-2 -25 -1 -50 0 -68" stroke="#1b5e20" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="rotate(70)">
          <path d="M0 0 C-14 -20 -10 -55 0 -70 C10 -55 14 -20 0 0 Z" fill="#388e3c"/>
          <path d="M0 0 C-2 -25 -1 -50 0 -68" stroke="#1b5e20" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="rotate(-35)">
          <path d="M0 0 C-14 -20 -10 -55 0 -70 C10 -55 14 -20 0 0 Z" fill="#4caf50"/>
          <path d="M0 0 C-2 -25 -1 -50 0 -68" stroke="#1b5e20" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="rotate(35)">
          <path d="M0 0 C-14 -20 -10 -55 0 -70 C10 -55 14 -20 0 0 Z" fill="#4caf50"/>
          <path d="M0 0 C-2 -25 -1 -50 0 -68" stroke="#1b5e20" stroke-width="1.5" fill="none"/>
        </g>
        <g transform="rotate(0)">
          <path d="M0 0 C-14 -20 -10 -55 0 -70 C10 -55 14 -20 0 0 Z" fill="#66bb6a"/>
          <path d="M0 0 C-2 -25 -1 -50 0 -68" stroke="#1b5e20" stroke-width="1.5" fill="none"/>
        </g>
      </g>
    </g>
  </defs>
</svg>

<div id="restscreen">

  <!-- scattered banana plants around the screen -->
  <svg class="banana-tree" style="top:6%; left:8%; transform:rotate(-8deg);" viewBox="0 0 140 200"><use href="#bananaPlant"/></svg>
  <svg class="banana-tree" style="top:10%; right:6%; transform:rotate(12deg) scale(0.8);" viewBox="0 0 140 200"><use href="#bananaPlant"/></svg>
  <svg class="banana-tree" style="bottom:8%; left:12%; transform:rotate(5deg) scale(1.1);" viewBox="0 0 140 200"><use href="#bananaPlant"/></svg>
  <svg class="banana-tree" style="bottom:6%; right:10%; transform:rotate(-15deg) scale(0.9);" viewBox="0 0 140 200"><use href="#bananaPlant"/></svg>
  <svg class="banana-tree" style="top:42%; left:3%; transform:rotate(3deg) scale(0.7);" viewBox="0 0 140 200"><use href="#bananaPlant"/></svg>

  <div class="content">
    <svg id="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#222" stroke-width="4"/>
      <path d="M60 95 Q70 105 80 95" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <path d="M120 95 Q130 105 140 95" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <path d="M75 135 Q100 150 125 135" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"/>
      <text x="140" y="55" font-size="20" fill="#222" font-family="sans-serif">Z</text>
      <text x="155" y="40" font-size="16" fill="#222" font-family="sans-serif">z</text>
      <text x="167" y="28" font-size="12" fill="#222" font-family="sans-serif">z</text>
    </svg>
    <p>Ahh, nee oru VAAZHA 🤡</p>
  </div>

</div>

<div id="status">Loading model...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const videoElement = document.getElementById('video');
const blackout = document.getElementById('blackout');
const restscreen = document.getElementById('restscreen');
const statusEl = document.getElementById('status');

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function eyeAspectRatio(landmarks, idx) {
  const [p1, p2, p3, p4, p5, p6] = idx.map(i => landmarks[i]);
  const vertical = dist(p2, p6) + dist(p3, p5);
  const horizontal = dist(p1, p4) * 2;
  return vertical / horizontal;
}

const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
const EAR_THRESHOLD = 0.22;

function showBlackout() {
  blackout.style.display = 'block';
  restscreen.style.display = 'none';
}
function showRestScreen() {
  blackout.style.display = 'none';
  restscreen.style.display = 'flex';
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults((results) => {
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    const leftEAR = eyeAspectRatio(landmarks, LEFT_EYE);
    const rightEAR = eyeAspectRatio(landmarks, RIGHT_EYE);
    const avgEAR = (leftEAR + rightEAR) / 2;

    if (avgEAR > EAR_THRESHOLD) {
      showBlackout();
      statusEl.textContent = `Eyes OPEN (EAR ${avgEAR.toFixed(2)}) -> blackout`;
    } else {
      showRestScreen();
      statusEl.textContent = `Eyes CLOSED (EAR ${avgEAR.toFixed(2)}) -> resting`;
    }
  } else {
    showRestScreen();
    statusEl.textContent = 'No face detected -> resting';
  }
});

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 320,
  height: 240,
  facingMode: 'user'
});

camera.start()
  .then(() => { statusEl.textContent = 'Running...'; })
  .catch(err => { statusEl.textContent = 'Camera error: ' + err.message; });
</script>

</body>
</html>
